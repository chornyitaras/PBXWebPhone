<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WEB PHONE</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --surface: #ffffff;
            --border: #d5dee8;
            --text: #1f2933;
            --text-muted: #5f6c7b;
            --btn-bg: #f4f7fa;
            --btn-bg-hover: #e8eef5;
            --btn-border: #c3d0dd;
            --ok: #1f9d55;
            --pending: #d69e2e;
            --error: #c53030;
            --answer-bg: #1f9d55;
            --answer-bg-hover: #198247;
            --hangup-bg: #d64545;
            --hangup-bg-hover: #b83232;
            --radius: 8px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            background: transparent;
            overflow-x: hidden;
        }

        body {
            font: 14px/1.35 "Segoe UI", Arial, sans-serif;
            color: var(--text);
        }

        .phone-shell {
            position: relative;
            width: 100%;
            max-width: 300px;
            padding: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
        }

        /* Status */
        .status-stack {
            display: grid;
            gap: 2px;
            min-height: 40px;
        }

        #state {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            font-size: 12px;
            color: var(--text-muted);
        }

        #state::before {
            content: "";
            flex: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
        }

        #state[data-level="ok"]::before { background: var(--ok); }
        #state[data-level="pending"]::before { background: var(--pending); }
        #state[data-level="error"]::before { background: var(--error); }

        #callState {
            margin: 0;
            min-height: 20px;
            font-size: 15px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #errState {
            margin: 0;
            font-size: 12px;
            color: var(--error);
        }

        #errState:empty {
            display: none;
        }

        [hidden] {
            display: none !important;
        }

        /* Buttons */
        .dtmf-button,
        .ctl,
        #btn,
        #btnKeyPad {
            min-width: 0;
            height: 34px;
            padding: 0 8px;
            cursor: pointer;
            appearance: none;
            border: 1px solid var(--btn-border);
            border-radius: var(--radius);
            background: var(--btn-bg);
            color: var(--text);
            font: inherit;
            font-weight: 500;
            white-space: nowrap;
            transition: background 0.12s ease, border-color 0.12s ease;
        }

        .dtmf-button:hover,
        .ctl:hover,
        #btn:hover,
        #btnKeyPad:hover {
            background: var(--btn-bg-hover);
        }

        .dtmf-button:active,
        .ctl:active,
        #btn:active,
        #btnKeyPad:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        button:focus-visible,
        #dialDigits:focus-visible {
            outline: 2px solid #3b82f6;
            outline-offset: 1px;
        }

        .ctl-answer,
        .ctl-hangup {
            border-color: transparent;
            color: #ffffff;
            font-weight: 600;
        }

        .ctl-answer { background: var(--answer-bg); }
        .ctl-answer:hover { background: var(--answer-bg-hover); }
        .ctl-hangup { background: var(--hangup-bg); }
        .ctl-hangup:hover { background: var(--hangup-bg-hover); }

        /* Dial box */
        .dial-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        #dialDigits {
            flex: 1;
            min-width: 0;
            height: 34px;
            padding: 0 10px;
            border: 1px solid var(--btn-border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            font: inherit;
        }

        #btnDial {
            flex: none;
        }

        /* Call controls: Answer / Hang up span the full row, the rest share it evenly */
        .call-row,
        .control-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .call-row:not(:has(> :not([hidden]))) {
            display: none;
        }

        .call-row > *,
        .control-row > * {
            flex: 1 1 0;
        }

        .vol-group {
            display: flex;
            flex: 1 1 0;
            min-width: 0;
        }

        .vol-group > button {
            flex: 1 1 0;
            padding: 0 4px;
        }

        .vol-group > button:first-child {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }

        .vol-group > button:last-child {
            margin-left: -1px;
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }

        /* Keypad (inline, below the controls so Mute / Hang up stay reachable) */
        .div-keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 5px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .keypad-grid {
            display: contents;
        }

        .dtmf-button {
            height: 34px;
            font-size: 16px;
            font-weight: 600;
        }

        #btnKeyPad[aria-expanded="true"] {
            background: #102a43;
            border-color: #102a43;
            color: #ffffff;
        }

        .vol-group svg {
            display: block;
            margin: 0 auto;
        }

        #debugLog {
            max-height: 120px;
            overflow: auto;
            margin: 8px 0 0;
            padding: 6px;
            background: #f1f5f9;
            border-radius: 6px;
            font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="phone-shell">
        <audio id="bell" src="sounds/incoming.mp3" loop></audio>
        <audio id="voice"></audio>
        <audio id="dtmf_1" src="sounds/dtmf/1.wav"></audio>
        <audio id="dtmf_2" src="sounds/dtmf/2.wav"></audio>
        <audio id="dtmf_3" src="sounds/dtmf/3.wav"></audio>
        <audio id="dtmf_4" src="sounds/dtmf/4.wav"></audio>
        <audio id="dtmf_5" src="sounds/dtmf/5.wav"></audio>
        <audio id="dtmf_6" src="sounds/dtmf/6.wav"></audio>
        <audio id="dtmf_7" src="sounds/dtmf/7.wav"></audio>
        <audio id="dtmf_8" src="sounds/dtmf/8.wav"></audio>
        <audio id="dtmf_9" src="sounds/dtmf/9.wav"></audio>
        <audio id="dtmf_0" src="sounds/dtmf/0.wav"></audio>
        <audio id="dtmf_*" src="sounds/dtmf/s.wav"></audio>
        <audio id="dtmf_#" src="sounds/dtmf/h.wav"></audio>

        <div class="status-stack">
            <p id="state"></p>
            <p id="callState"></p>
            <p id="errState"></p>
        </div>

        <div class="dial-row" id="dialBox" hidden>
            <input id="dialDigits" type="tel" inputmode="tel" autocomplete="off" placeholder="Number" aria-label="Number to dial">
            <button type="button" class="ctl" id="btnDial">Call</button>
        </div>

        <div class="call-row">
            <button type="button" class="ctl ctl-answer" id="btnAnswer" hidden>Answer</button>
            <button type="button" class="ctl ctl-hangup" id="btnHangup" hidden>Hang up</button>
        </div>

        <div class="control-row">
            <button id="btn" type="button">Mute</button>
            <button type="button" class="btn" id="btnKeyPad" aria-controls="divKeyPad" aria-expanded="false">Keypad</button>
            <div class="vol-group" id="volGroup" role="group" aria-label="Volume">
                <button type="button" class="ctl" id="btnVolDown" aria-label="Volume down" title="Volume down"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 6h2.5L9 3v10L5.5 10H3z" fill="currentColor"/><path d="M11 8h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
                <button type="button" class="ctl" id="btnVolUp" aria-label="Volume up" title="Volume up"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 6h2.5L9 3v10L5.5 10H3z" fill="currentColor"/><path d="M11 8h4M13 6v4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
            </div>
        </div>
        <div id="divKeyPad" class="div-keypad" hidden>
            <div class="keypad-grid">
                <button type="button" class="btn dtmf-button" data-dtmf="1">1</button>
                <button type="button" class="btn dtmf-button" data-dtmf="2">2</button>
                <button type="button" class="btn dtmf-button" data-dtmf="3">3</button>
                <button type="button" class="btn dtmf-button" data-dtmf="4">4</button>
                <button type="button" class="btn dtmf-button" data-dtmf="5">5</button>
                <button type="button" class="btn dtmf-button" data-dtmf="6">6</button>
                <button type="button" class="btn dtmf-button" data-dtmf="7">7</button>
                <button type="button" class="btn dtmf-button" data-dtmf="8">8</button>
                <button type="button" class="btn dtmf-button" data-dtmf="9">9</button>
                <button type="button" class="btn dtmf-button" data-dtmf="*">*</button>
                <button type="button" class="btn dtmf-button" data-dtmf="0">0</button>
                <button type="button" class="btn dtmf-button" data-dtmf="#">#</button>
            </div>
        </div>

        <pre id="debugLog" hidden></pre>
    </div>

    <script src="scripts/bootstrap.js?0.12.1"></script>
    <script src="scripts/sip-0.11.6.min.js"></script>
    <script src="scripts/phone.js?0.12.1"></script>
</body>
</html>
