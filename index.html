<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>WEB PHONE</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(180deg, #f5f7fb 0%, #edf2f7 100%);
            color: #1f2933;
        }

        .phone-shell {
            position: relative;
            width: min(360px, calc(100vw - 32px));
            margin: 24px;
            padding: 18px;
            background: #ffffff;
            border: 1px solid #d8e1ea;
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            box-sizing: border-box;
        }

        .status-stack {
            display: grid;
            gap: 0.35rem;
        }

        #state,
        #callState,
        #errState {
            min-height: 1.25rem;
            margin: 0;
            font-size: 1rem;
            line-height: 1.3;
        }

        #errState {
            color: #b42318;
        }

        .div-keypad {
            position: absolute;
            top: 106px;
            left: 18px;
            right: 18px;
            visibility: hidden;
            background: #fff;
            border: 1px solid #d8e1ea;
            border-radius: 14px;
            padding: 0.85rem;
            box-sizing: border-box;
            box-shadow: 0 14px 30px rgba(15, 23, 42, 0.16);
            z-index: 10;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.65rem;
            margin-bottom: 0.75rem;
        }

        .control-row {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .dtmf-button,
        #btn,
        #btnKeyPad,
        #closeKeyPad {
            cursor: pointer;
            appearance: none;
            border: 1px solid #bfd0e0;
            border-radius: 10px;
            background: #f8fafc;
            color: #102a43;
            font: inherit;
            line-height: 1;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
        }

        .dtmf-button:hover,
        #btn:hover,
        #btnKeyPad:hover,
        #closeKeyPad:hover {
            background: #eef4fb;
            border-color: #98afc4;
        }

        .dtmf-button:active,
        #btn:active,
        #btnKeyPad:active,
        #closeKeyPad:active {
            transform: translateY(1px);
        }

        .dtmf-button {
            min-height: 46px;
            font-size: 1.05rem;
            font-weight: 600;
        }

        #btn,
        #btnKeyPad {
            min-width: 86px;
            padding: 0.75rem 1rem;
        }

        #closeKeyPad {
            width: 100%;
            min-height: 44px;
            background: #102a43;
            border-color: #102a43;
            color: #ffffff;
        }

        #closeKeyPad:hover {
            background: #0b2239;
            border-color: #0b2239;
        }

        @media (max-width: 480px) {
            .phone-shell {
                margin: 12px;
                width: calc(100vw - 24px);
            }

            .div-keypad {
                left: 12px;
                right: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="phone-shell">
        <audio id="bell" src="sounds/incoming.mp3" loop></audio>
        <audio id="voice"></audio>
        <audio id="dtmf_1" src="sounds/dtmf/1.wav"></audio>
        <audio id="dtmf_2" src="sounds/dtmf/2.wav"></audio>
        <audio id="dtmf_3" src="sounds/dtmf/3.wav"></audio>
        <audio id="dtmf_4" src="sounds/dtmf/4.wav"></audio>
        <audio id="dtmf_5" src="sounds/dtmf/5.wav"></audio>
        <audio id="dtmf_6" src="sounds/dtmf/6.wav"></audio>
        <audio id="dtmf_7" src="sounds/dtmf/7.wav"></audio>
        <audio id="dtmf_8" src="sounds/dtmf/8.wav"></audio>
        <audio id="dtmf_9" src="sounds/dtmf/9.wav"></audio>
        <audio id="dtmf_0" src="sounds/dtmf/0.wav"></audio>
        <audio id="dtmf_*" src="sounds/dtmf/s.wav"></audio>
        <audio id="dtmf_#" src="sounds/dtmf/h.wav"></audio>
        <audio id="dtmfTone" src="sounds/dtmf.wav"></audio>

        <div class="status-stack">
            <p id="state"></p>
            <p id="callState"></p>
            <p id="errState"></p>
        </div>

        <div id="divKeyPad" class="span2 well div-keypad" aria-hidden="true">
            <div class="keypad-grid">
                <button type="button" class="btn dtmf-button" data-dtmf="1">1</button>
                <button type="button" class="btn dtmf-button" data-dtmf="2">2</button>
                <button type="button" class="btn dtmf-button" data-dtmf="3">3</button>
                <button type="button" class="btn dtmf-button" data-dtmf="4">4</button>
                <button type="button" class="btn dtmf-button" data-dtmf="5">5</button>
                <button type="button" class="btn dtmf-button" data-dtmf="6">6</button>
                <button type="button" class="btn dtmf-button" data-dtmf="7">7</button>
                <button type="button" class="btn dtmf-button" data-dtmf="8">8</button>
                <button type="button" class="btn dtmf-button" data-dtmf="9">9</button>
                <button type="button" class="btn dtmf-button" data-dtmf="*">*</button>
                <button type="button" class="btn dtmf-button" data-dtmf="0">0</button>
                <button type="button" class="btn dtmf-button" data-dtmf="#">#</button>
            </div>
            <button type="button" id="closeKeyPad" class="btn btn-medium btn-danger">Close</button>
        </div>

        <div class="control-row">
            <button id="btn" type="button">Mute</button>
            <button type="button" class="btn" id="btnKeyPad">KeyPad</button>
        </div>
    </div>

    <script src="scripts/bootstrap.js"></script>
    <script src="scripts/sip-0.11.6.min.js"></script>
    <script src="scripts/phone.js?0.11.7"></script>
</body>
</html>
